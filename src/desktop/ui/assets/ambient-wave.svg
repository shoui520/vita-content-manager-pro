<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" preserveAspectRatio="none">
  <defs>
    <radialGradient id="haze"><stop stop-color="#849fbb" stop-opacity=".18"/><stop offset=".5" stop-color="#748fae" stop-opacity=".07"/><stop offset="1" stop-color="#748fae" stop-opacity="0"/></radialGradient>
    <linearGradient id="light"><stop stop-color="#7199b7" stop-opacity="0"/><stop offset=".25" stop-color="#83adcb" stop-opacity=".14"/><stop offset=".55" stop-color="#c0d9e5" stop-opacity=".38"/><stop offset=".8" stop-color="#8f95bd" stop-opacity=".13"/><stop offset="1" stop-color="#8f95bd" stop-opacity="0"/></linearGradient>
